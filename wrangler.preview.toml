# Preview only. Do not add routes or the production SITE KV binding.
# Deploy with: npx wrangler deploy -c wrangler.preview.toml
# Live worker name is word-unscrambler and must not be targeted.
name = "lus-redesign-preview"
main = "preview-worker.js"
compatibility_date = "2026-10-06"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

[observability]
enabled = true

[observability.traces]
enabled = true
