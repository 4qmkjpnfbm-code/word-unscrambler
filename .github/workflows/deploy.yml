name: Deploy Worker
# Runs only when you click Run workflow, after CLOUDFLARE_API_TOKEN is set
# (Dashboard → Workers → Manage API tokens → Edit Cloudflare Workers).
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c9fe7d6bb86eb2dbc6752bf8f453e877
          command: deploy
